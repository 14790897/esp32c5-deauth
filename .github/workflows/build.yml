name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build esp32c5 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c5
          path: .
          # Also exercises the local Wi-Fi library patch script against the
          # exact IDF version used to build. The container is disposable.
          command: python3 tools/patch_libnet80211.py && idf.py build && python3 -m esptool --chip esp32c5 merge-bin -o build/c5_deauth_full.bin --target-offset 0 --flash-mode dio --flash-freq 80m --flash-size 4MB --pad-to-size 4MB 0x2000 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/c5_deauth.bin

      - name: Semantic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npx semantic-release
